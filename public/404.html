:root{color-scheme:dark;--ink:#ece4d4;--dim:#b9b0a1;--faint:#8c8678;--gold:#e3b558;--rhine:#6fc2a8;--line:rgba(236,228,212,.14)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100dvh;display:grid;grid-template-rows:1fr auto;background:radial-gradient(120% 80% at 50% 115%,#0f3a33 0%,#0a1a1c 38%,#06080a 72%);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(1080px,100% - 48px);margin:0 auto;padding:clamp(56px,12vh,140px) 0 64px}
.k{font:500 11px/1 ui-monospace,"SFMono-Regular",Menlo,monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin:0 0 18px}
h1{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(3.2rem,9vw,7.5rem);line-height:.9;margin:0;letter-spacing:-.01em}
h1 i{color:var(--gold);font-weight:300}
.lead{max-width:52ch;color:var(--dim);font-size:clamp(15px,1.4vw,17px);margin:26px 0 clamp(48px,9vh,96px)}
.works{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.works li{border-bottom:1px solid var(--line)}
.works a{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:clamp(16px,3vw,40px);padding:26px 4px;color:inherit;text-decoration:none}
.ring{width:56px;height:56px}
.ring circle{fill:none;stroke:var(--gold);stroke-width:1.5}
.ring .r2{stroke:var(--rhine);stroke-width:1;stroke-dasharray:2 4;transform-origin:28px 28px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ring .r2{animation:none}}
.works h2{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(1.7rem,3.4vw,2.6rem);line-height:1.05;margin:0 0 6px}
.works h2 span{display:block;font-style:italic;font-weight:300;font-size:.55em;color:var(--dim);margin-top:4px}
.works p{margin:0;color:var(--dim);max-width:60ch}
.go{font:500 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.works a:hover h2,.works a:focus-visible h2{color:var(--gold)}
.works a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
footer{width:min(1080px,100% - 48px);margin:0 auto;padding:24px 0 32px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:space-between}
@media (max-width:640px){.works a{grid-template-columns:48px minmax(0,1fr)}.ring{width:44px;height:44px}.go{grid-column:2}}
</style>
</head>
